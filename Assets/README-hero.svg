  <text x="92" y="236" fill="#F7FBFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="760" letter-spacing="-2">把注意力，留给主线。</text>
  <text x="94" y="294" fill="#AFC1D1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">为 Agent 并发时代设计的 macOS 本地专注轨迹与训练工具</text>

