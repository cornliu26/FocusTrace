<svg width="1440" height="720" viewBox="0 0 1440 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FocusTrace product overview</title>
  <desc id="desc">A calm dark-blue FocusTrace interface with a focus ring, workflow timeline, and one next-step recommendation.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="0" x2="1320" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0D1C2E"/>
      <stop offset="1" stop-color="#10263A"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#57E0C5"/>
      <stop offset="1" stop-color="#68C7FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="850" y1="84" x2="1260" y2="632" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183149"/>
      <stop offset="1" stop-color="#0E1F31"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#02060C" flood-opacity="0.35"/>
    </filter>
  </defs>

