name: 更新失败
description: 报告 FocusTrace 检查、下载、替换或重启失败
title: "[Update] "
body:
  - type: markdown
    attributes:
      value: |
        FocusTrace 只会预填版本、macOS、失败阶段和错误代码，不会上传活动记录或工作内容。
  - type: textarea
    id: problem
    attributes:
      label: 你看到了什么
      description: 请说明点击更新后发生了什么，以及应用是否重新打开。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 当前 FocusTrace 版本
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 版本
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: 安全诊断信息
      description: 由 FocusTrace 预填；这里只包含版本、系统、阶段和错误代码。
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有附加活动记录、工作流名称、需求内容或其他私人工作信息
          required: true
